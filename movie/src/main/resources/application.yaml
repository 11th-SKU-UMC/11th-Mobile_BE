spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/umc_movie}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  jackson:
    deserialization:
      accept-float-as-int: false
      fail-on-unknown-properties: true

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:3600}
  clock-skew: ${JWT_CLOCK_SKEW:0}
